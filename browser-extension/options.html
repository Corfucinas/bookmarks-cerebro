<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cerebro Settings</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-wrapper label {
      margin-top: 0;
      cursor: pointer;
    }
    button {
      margin-top: 20px;
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover { background: #4338ca; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #save-status { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    h2 {
      font-size: 18px;
      margin-top: 36px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
    }
    #queue-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-value {
      font-weight: 600;
      font-size: 18px;
    }
    .stat-label { color: #6b7280; }
    #queue-list { margin-top: 12px; }
    .queue-item {
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .queue-item .url { color: #4f46e5; word-break: break-all; font-weight: 500; }
    .queue-item .meta {
      color: #6b7280;
      font-size: 12px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .queue-empty { color: #6b7280; font-style: italic; }
    .retry-btn {
      padding: 4px 10px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .remove-btn {
      padding: 4px 10px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .queue-actions { display: flex; gap: 6px; margin-left: auto; }
    #failed-section h2 { color: #dc2626; }
    .failed-item {
      padding: 12px;
      border: 1px solid #fca5a5;
      background: #fef2f2;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .failed-item .url { color: #991b1b; word-break: break-all; font-weight: 500; }
  </style>
</head>
<body>
  <h1>🔖 Cerebro Settings</h1>
  <div class="subtitle">Configure server endpoint and manage offline queue</div>

  <label for="serverUrl">Server URL</label>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8765">

  <div class="checkbox-wrapper">
    <input type="checkbox" id="autoTag" checked>
    <label for="autoTag">Auto-tag bookmarks using ML classification</label>
  </div>

  <button id="save-btn">Save Settings</button>
  <div id="save-status"></div>

  <h2>Pending Queue</h2>
  <div id="queue-stats">
    <div class="stat-item">
      <span class="stat-value" id="pending-count">0</span>
      <span class="stat-label">pending</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="failed-count">0</span>
      <span class="stat-label">failed</span>
    </div>
  </div>
  <button id="retry-all-btn">Retry All Now</button>
  <div id="queue-list"><div class="queue-empty">Loading...</div></div>

  <div id="failed-section" style="display: none;">
    <h2>Failed Queue</h2>
    <div id="failed-list"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
