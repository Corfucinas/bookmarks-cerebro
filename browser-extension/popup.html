<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cerebro</title>
  <style>
    body { width: 300px; padding: 16px; font-family: system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    #url { font-size: 12px; color: #666; margin-bottom: 12px; word-break: break-all; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #cerebro-btn { background: #4f46e5; color: white; }
    #cerebro-btn:hover { background: #4338ca; }
    #cerebro-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 12px; min-height: 16px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    .warning { color: #ca8a04; }
    .queued { color: #2563eb; }
    #dup-warning { display: none; background: #fef3c7; color: #92400e; padding: 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; }
    #queue-count { display: none; font-size: 11px; color: #dc2626; margin-bottom: 8px; }
    #settings-link { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: #4f46e5; text-decoration: none; }
    #settings-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🔖 Cerebro <span style="font-size:11px; font-weight:normal;">v0.2</span></h1>
  <div id="dup-warning">⚠️ This page is already bookmarked</div>
  <div id="queue-count"></div>
  <div id="url">Loading...</div>
  <button id="cerebro-btn">Cerebro this page</button>
  <div id="status"></div>
  <a href="#" id="settings-link">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
