# Semantic Brain Map Taxonomy for Bookmarks Cerebro
name: "Cerebro Taxonomy"
version: "0.1.0"
description: "Personal knowledge taxonomy reflecting how information actually connects"

roots:
  - name: "AI/ML"
    description: "Artificial intelligence, machine learning, deep learning, and neural networks"
    children:
      - name: "Models"
        description: "Specific model architectures and implementations"
      - name: "Frameworks"
        description: "PyTorch, TensorFlow, JAX, and tooling"
      - name: "Research"
        description: "Papers, arXiv, academic reading"
      - name: "Tools"
        description: "LLMs, vector DBs, training infrastructure"
      - name: "Ethics"
        description: "AI safety, alignment, policy"

  - name: "Programming"
    description: "Software engineering, languages, frameworks, and development practices"
    children:
      - name: "Languages"
        description: "Python, Rust, JavaScript, Go, etc."
      - name: "Frameworks"
        description: "Web frameworks, application frameworks"
      - name: "Patterns"
        description: "Design patterns, architecture, best practices"
      - name: "DevEx"
        description: "Developer tools, editors, debugging, CI/CD"
      - name: "Data"
        description: "Databases, SQL, data engineering, analytics"
      - name: "Testing"
        description: "Unit tests, integration, QA, automation"

  - name: "Systems"
    description: "Infrastructure, cloud, DevOps, networking, and security"
    children:
      - name: "Cloud"
        description: "AWS, GCP, Azure, serverless"
      - name: "Containers"
        description: "Docker, Kubernetes, orchestration"
      - name: "Networking"
        description: "Protocols, VPN, Tor, DNS"
      - name: "Security"
        description: "Cryptography, pentesting, hardening"
      - name: "Linux"
        description: "Distros, kernel, system administration"
      - name: "Observability"
        description: "Monitoring, tracing, logging, metrics"

  - name: "Design"
    description: "User interface, user experience, visual design, and frontend"
    children:
      - name: "UI/UX"
        description: "Interface design, interaction patterns, accessibility"
      - name: "Frontend"
        description: "CSS, HTML, React, Vue, web components"
      - name: "Visualization"
        description: "Data viz, charts, dashboards, 3D"
      - name: "Tools"
        description: "Figma, Adobe, design systems"

  - name: "Research"
    description: "Academic, scientific, and deep learning resources"
    children:
      - name: "Papers"
        description: "arXiv, journals, conference proceedings"
      - name: "Courses"
        description: "Online courses, MOOCs, tutorials"
      - name: "Books"
        description: "Reading lists, textbooks, literature"
      - name: "Reference"
        description: "Documentation, cheatsheets, wikis"

  - name: "Productivity"
    description: "Workflow optimization, tools, and self-hosting"
    children:
      - name: "Workflows"
        description: "Time management, note-taking, PKM"
      - name: "Tools"
        description: "Editors, terminals, automation"
      - name: "Self-Hosting"
        description: "Homelab, personal servers, NAS"
      - name: "Automation"
        description: "Scripts, bots, IFTTT, cron"

  - name: "Finance"
    description: "Markets, trading, quantitative analysis, and cryptocurrency"
    children:
      - name: "Quant"
        description: "Quantitative trading, strategies, backtesting"
      - name: "Crypto"
        description: "Blockchain, DeFi, smart contracts"
      - name: "Markets"
        description: "Stocks, forex, macro analysis"
      - name: "Tools"
        description: "Trading platforms, data feeds"

  - name: "Life"
    description: "Health, hobbies, travel, and personal interests"
    children:
      - name: "Health"
        description: "Fitness, nutrition, mental health"
      - name: "Hobbies"
        description: "Guitar, gaming, crafting"
      - name: "Travel"
        description: "Destinations, guides, culture"
      - name: "Food"
        description: "Recipes, restaurants, cuisine"
      - name: "Personal"
        description: "Goals, journaling, identity"

  - name: "Hardware"
    description: "Microcontrollers, IoT, embedded systems, and electronics"
    children:
      - name: "Microcontrollers"
        description: "Arduino, Raspberry Pi, ESP32"
      - name: "IoT"
        description: "Sensors, smart home, MQTT"
      - name: "Electronics"
        description: "Circuits, soldering, components"

  - name: "Career"
    description: "Professional growth, interviews, freelancing, and business"
    children:
      - name: "Interview"
        description: "System design, algorithms, behavioral"
      - name: "Freelancing"
        description: "Clients, contracts, billing"
      - name: "Business"
        description: "Startups, strategy, marketing"
      - name: "Skills"
        description: "Leadership, communication, negotiation"

  - name: "Reference"
    description: "Quick lookups, utilities, and general knowledge"
    children:
      - name: "Utilities"
        description: "Converters, calculators, generators"
      - name: "Cheatsheets"
        description: "Syntax, commands, quick references"
      - name: "Wikipedia"
        description: "General knowledge, encyclopedia"
      - name: "OSINT"
        description: "Open source intelligence tools"
