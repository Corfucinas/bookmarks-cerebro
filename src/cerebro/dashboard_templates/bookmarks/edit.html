{% extends "base.html" %}

{% block title %}Edit {{ bookmark.title }} - Cerebro{% endblock %}

{% block content %}
<h1>Edit Bookmark</h1>

<form action="/bookmark/{{ bookmark.id }}/edit" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ bookmark.title }}" required>

    <label for="tags">Tags</label>
    <input type="text" id="tags" name="tags" value="{{ bookmark.tags | join(', ') }}">
    <small>Comma-separated tags</small>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4">{{ bookmark.description }}</textarea>

    <div class="grid">
        <button type="submit">Save Changes</button>
        <a href="/bookmark/{{ bookmark.id }}" role="button" class="secondary">Cancel</a>
    </div>
</form>
{% endblock %}
