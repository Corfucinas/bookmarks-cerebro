<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookmarks Cerebro{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-+uj0y8e+0Z6c5M5u5X6T5M5z5N5u5T5M5z5+5T5M=" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #bd93f9;
            --primary-hover: #ff79c6;
            --background: #282a36;
            --card-bg: #44475a;
            --text: #f8f8f2;
            --muted: #6272a4;
            --accent: #50fa7b;
            --warning: #ffb86c;
            --danger: #ff5555;
        }

        body {
            background: linear-gradient(135deg, var(--background) 0%, #1e1e2e 100%);
            min-height: 100vh;
        }

        nav {
            background: var(--card-bg);
            border-bottom: 2px solid var(--primary);
            padding: 1rem;
            margin-bottom: 2rem;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            margin-right: 1.5rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary-hover);
        }

        nav a.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.25rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--muted);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.2);
        }

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .bookmark-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .bookmark-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .bookmark-title a {
            color: inherit;
            text-decoration: none;
        }

        .bookmark-title a:hover {
            color: var(--primary-hover);
        }

        .bookmark-url {
            font-size: 0.85rem;
            color: var(--muted);
            word-break: break-all;
            margin-bottom: 0.75rem;
        }

        .bookmark-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .tag {
            background: linear-gradient(135deg, var(--primary), #6c5ce7);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .category {
            background: var(--muted);
            color: var(--text);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .dead-link {
            background: var(--danger);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid var(--muted);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination a, .pagination span {
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s;
        }

        .pagination a:hover {
            background: var(--primary);
        }

        .pagination .active {
            background: var(--primary);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }

        .empty-state h3 {
            margin-bottom: 1rem;
        }

        .detail-header {
            margin-bottom: 2rem;
        }

        .detail-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .detail-url {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .detail-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .detail-section h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            margin-top: 4rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .badge-dead {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 768px) {
            .bookmark-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="container">
            <a href="/bookmarks">📚 Bookmarks</a>
            <a href="/stats">📊 Stats</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Bookmarks Cerebro — <a href="https://github.com">GitHub</a></p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
