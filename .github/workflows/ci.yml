name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install lint tools
        run: |
          uv tool install ruff
          uv tool install mypy
          uv tool install yamllint
      - name: ruff check
        run: uvx ruff check src/
      - name: ruff format check
        run: uvx ruff format --check src/
      - name: mypy
        run: uvx mypy --explicit-package-bases src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Pipeline smoke test (no fetch)
        run: uv run python -m cerebro.cli pipeline .github/testdata/sample.html --taxonomy taxonomy.yaml --output-dir /tmp/cerebro-test --no-ml
      - name: Verify outputs
        run: |
          test -f /tmp/cerebro-test/processed/enriched_bookmarks.json
          test -d /tmp/cerebro-test/vault
          echo "Pipeline outputs verified"

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t cerebro .
      - name: Verify image metadata
        run: docker image inspect cerebro --format='{{.Size}}' | xargs -I {} test {} -gt 0

  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install extension dependencies and test
        run: |
          cd browser-extension
          npm ci
          npm test
