name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: uv pip install -e ".[dev]"
      - name: ruff check
        run: uv run ruff check src/
      - name: ruff format check
        run: uv run ruff format --check src/
      - name: mypy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: uv pip install -e ".[dev]"
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: |
          uv venv
          uv pip install -e ".[dev]"
        run: uv pip install -e ".[dev]"
      - name: Pipeline smoke test (no fetch)
        run: uv run python -m cerebro.cli pipeline .github/testdata/sample.html --taxonomy taxonomy.yaml --output-dir /tmp/cerebro-test --no-ml
      - name: Verify outputs
        run: |
          test -f /tmp/cerebro-test/processed/enriched_bookmarks.json
          test -d /tmp/cerebro-test/vault
          echo "Pipeline outputs verified"
